version = 1

; Общие настройки для всех моделей
[*]
jinja = true
flash-attn = on
; подобрать выгрузку в RAM автоматически, чтобы модель и контекст влезли в 16 GB
fit = on
; KV-кэш в 8 бит — вдвое меньше памяти на контекст почти без потерь
cache-type-k = q8_0
cache-type-v = q8_0
; страховка от зацикливания: не больше 32K токенов на ответ (размышления партиями ограничивает посредник think_proxy, 8081)
n-predict = 32768

; Gemma 4 26B-A4B, официальная QAT от Google (понимает картинки)
; параметры генерации — официальные рекомендации Google
[gemma-4-26b-a4b]
model = D:\llm\models\gemma-4-26b-a4b\gemma-4-26B_q4_0-it.gguf
mmproj = D:\llm\models\gemma-4-26b-a4b\gemma-4-26B-it-mmproj.gguf
; модуль зрения считается на процессоре: картинки нужны редко, а 1,2 GB видеопамяти достаются экспертам модели
no-mmproj-offload = true
; 256K токенов — максимум модели. Со зрением на CPU: ~60 ток/с (при 128K ~69), документ на 60K токенов читается ~56 с
c = 262144
temp = 1.0
top-p = 0.95
top-k = 64

; Qwen3.8-27B (плотная, понимает картинки), кванты ISTA-DASLab GSQ-RCO со встроенной головой MTP.
; Замеры 2026-11-06 (RTX 4060 Ti 16 GB, рабочий стол занимает ~1 GB): этот пресет — генерация 33-41 ток/с,
; чтение промпта ~850 ток/с (16K токенов за ~18 с), VRAM 15.5 GB. Без MTP генерация ~20 ток/с.
; Выше ~15.8 GB VRAM Windows молча уходит в общую память и чтение промпта падает в 10-100 раз
; (так вышло с 64K+q8 и MTP n=3, 128K, IQ3_XXS 128K/256K) — контекст не увеличивать.
; Параметры генерации — рекомендации Qwen/unsloth для режима размышлений.
[qwen3.8-27b]
; IQ3_S 3.5 bpw, 12.1 GB: по замерам ISTA почти без потерь к BF16
model = D:\llm\models\qwen3.8-27b\Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
mmproj = D:\llm\models\qwen3.8-27b\mmproj-Qwen3.8-27B-BF16.gguf
no-mmproj-offload = true
; плотной модели нельзя уходить в RAM (скорость падает в разы): всё на GPU
fit = off
n-gpu-layers = all
c = 98304
cache-type-k = q4_0
cache-type-v = q4_0
; MTP: модель сама угадывает следующие токены; n-max 3 и ngram-mod не быстрее
spec-type = draft-mtp
spec-draft-n-max = 2
gpu-layers-draft = all
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
; по умолчанию xhigh — сильно передумывает
chat-template-kwargs = {"reasoning_effort": "medium"}

; DeepSeek-V4-Pro-Qwen3.5-9B UNCENSORED heretic (xtools-at): Qwen3.5-9B, дистиллят DeepSeek-V4-Pro
; на ~250K задачах по математике и STEM, отказы сняты (Heretic ARA, 3/100, KL 0.042). Понимает картинки.
; Кванты prithivMLmods со встроенной головой MTP, Q8_0 9.8 GB (SHA256 сверены 2026-11-20).
; Гибридное внимание: полное только в 8 слоях из 32, поэтому KV-кэш маленький (~16 KB/токен в q8).
; Параметры генерации — рекомендации Qwen для режима размышлений (в карточке модели своих нет).
; Замеры 2026-11-20 (RTX 4060 Ti 16 GB): 128K — VRAM 13.0 GB, генерация 54 ток/с (MTP угадывает 83%);
; 192K — VRAM 14.6 GB, 46 ток/с; 256K — 15.86 GB (выше порога ухода в общую память), документ 106K токенов
; читается 941 ток/с, «иголку» нашла, генерация на таком контексте ~23 ток/с. Выбрано 192K.
[deepseek-v4-qwen3.5-9b-heretic]
model = D:\llm\models\deepseek-v4-pro-qwen3.5-9b-heretic\DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.Q8_0.gguf
mmproj = D:\llm\models\deepseek-v4-pro-qwen3.5-9b-heretic\DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.mmproj-bf16.gguf
no-mmproj-offload = true
fit = off
n-gpu-layers = all
c = 196608
spec-type = draft-mtp
spec-draft-n-max = 2
gpu-layers-draft = all
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
