version = 1

; Общие настройки для всех моделей
[*]
jinja = true
flash-attn = on
; подобрать выгрузку в RAM автоматически, чтобы модель и контекст влезли в 16 GB
fit = on
; KV-кэш в 8 бит — вдвое меньше памяти на контекст почти без потерь
cache-type-k = q8_0
cache-type-v = q8_0
; страховка от зацикливания: не больше 32K токенов на ответ (размышления партиями ограничивает посредник think_proxy, 8081)
n-predict = 32768

; Gemma 4 26B-A4B, официальная QAT от Google (понимает картинки)
; параметры генерации — официальные рекомендации Google
[gemma-4-26b-a4b]
model = D:\llm\models\gemma-4-26b-a4b\gemma-4-26B_q4_0-it.gguf
mmproj = D:\llm\models\gemma-4-26b-a4b\gemma-4-26B-it-mmproj.gguf
; модуль зрения считается на процессоре: картинки нужны редко, а 1,2 GB видеопамяти достаются экспертам модели
no-mmproj-offload = true
; 256K токенов — максимум модели. Со зрением на CPU: ~60 ток/с (при 128K ~69), документ на 60K токенов читается ~56 с
c = 262144
temp = 1.0
top-p = 0.95
top-k = 64
