# SearXNG для Open WebUI (только локально, 127.0.0.1:8888)
use_default_settings: true
general:
  instance_name: "local-searxng"
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json
server:
  secret_key: "<сгенерировать: openssl rand -hex 32>"
  limiter: false
  image_proxy: false
  public_instance: false
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: startpage
    disabled: false
    inactive: false
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
    inactive: false
